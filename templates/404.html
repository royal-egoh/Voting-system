<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            max-width: 600px;
            width: 100%;
        }

        /* ── Error Card ── */
        .error-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 50px 40px;
            text-align: center;
        }

        .error-number {
            color: #667eea;
            font-size: 120px;
            font-weight: bold;
            line-height: 1;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .error-title {
            color: #333;
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .error-subtitle {
            color: #666;
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 35px;
        }

        /* ── Message Box ── */
        .message-box {
            background: #e7f1ff;
            border-left: 4px solid #667eea;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 30px;
            text-align: left;
        }

        .message-box .icon {
            font-size: 20px;
            margin-bottom: 10px;
        }

        .message-box p {
            color: #555;
            font-size: 14px;
            line-height: 1.6;
        }

        /* ── Action Button ── */
        .btn {
            width: 100%;
            padding: 18px 30px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            text-align: center;
            transition: all 0.3s;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        /* ── Decorative Elements ── */
        .icon-404 {
            font-size: 100px;
            margin-bottom: 20px;
            opacity: 0.8;
        }

        /* ── Responsive ── */
        @media (max-width: 768px) {
            .error-card {
                padding: 40px 25px;
            }

            .error-number {
                font-size: 80px;
            }

            .error-title {
                font-size: 28px;
            }

            .error-subtitle {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
<div class="container">

    <div class="error-card">
        <!-- Decorative Icon -->
        <div class="icon-404">🔍</div>

        <!-- Error Number -->
        <div class="error-number">404</div>

        <!-- Error Message -->
        <h1 class="error-title">Page Not Found</h1>
        <p class="error-subtitle">
            Oops! The page you're looking for doesn't exist or has been moved.
        </p>

        <!-- Info Box -->
        <div class="message-box">
            <div class="icon">ℹ️</div>
            <p>
                The page you requested could not be found. This might be because the URL is incorrect, 
                the page has been removed, or you don't have permission to access it.
            </p>
        </div>

        <!-- Action Button -->
        <!-- JINJA: Redirect to dashboard -->
        <a href="{{ url_for('home') }}" class="btn">
            Return to Dashboard
        </a>
    </div>

</div>
</body>
</html>
